<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satpaev</title>
<meta name="description" content="Продукты и проекты Satpaev. Скоро здесь будет сайт.">
<style>
  :root { --bg:#0a0b10; --fg:#f2f3f7; --muted:#8a8fa3; --a:#7c5cff; --b:#2ec5ff; }
  * { box-sizing:border-box; margin:0 }
  body { min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:24px; text-align:center }
  .glow { position:fixed; inset:auto; width:520px; height:520px; border-radius:50%; filter:blur(120px); opacity:.35;
          background:radial-gradient(circle,var(--a),transparent 60%); top:-120px; left:50%; transform:translateX(-50%) }
  h1 { font-size:clamp(40px,9vw,88px); letter-spacing:-.04em; font-weight:800; position:relative }
  h1 span { background:linear-gradient(90deg,var(--a),var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent }
  p { color:var(--muted); margin-top:14px; font-size:18px; position:relative }
  a { color:var(--fg); display:inline-block; margin-top:28px; padding:12px 22px; border-radius:14px;
      background:linear-gradient(90deg,var(--a),var(--b)); text-decoration:none; font-weight:600; position:relative }
</style>
</head>
<body>
  <div class="glow"></div>
  <main>
    <h1>satpaev<span>.ceo</span></h1>
    <p>Продукты и проекты. Сайт скоро будет здесь.</p>
    <a href="https://t.me/S_Spiderman_bot">Бакси в Telegram</a>
  </main>
</body>
</html>
