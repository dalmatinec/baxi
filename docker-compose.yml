# Запуск на любом сервере с Docker:
#   cp .env.example .env && nano .env      # токен бота, свой Telegram ID, ключ нейросети
#   docker compose up -d --build
#   docker compose logs -f
services:
  bot:
    build: .
    container_name: chatbot
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data          # база бота живёт здесь, переживает обновления
    mem_limit: 300m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
